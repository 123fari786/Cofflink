name: cofeelink
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  badges: ^3.1.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.0+1
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  firebase_database: ^11.3.7
  shared_preferences: ^2.5.3
  firebase_messaging: ^15.2.10
  app_settings: ^6.1.1
  flutter_reactive_ble: ^5.0.2
  flutter_blue_plus: ^1.8.0
  flutter_ble_peripheral: ^1.2.6
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.1
  googleapis_auth: ^2.0.0
  http: ^1.4.0
  flutter_local_notifications: ^17.0.0
  flutter_nearby_connections:
    path: packages/flutter_nearby_connections
  device_info_plus: ^11.5.0
  cloud_firestore: ^5.6.11
  get: ^4.7.2
  path_provider: ^2.1.5
  intl: ^0.20.2
  firebase_storage: ^12.4.10
  provider: ^6.1.5
  package_info_plus: ^8.3.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  change_app_package_name: ^1.5.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # <-- added for app icon generation

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icccon.png" # <-- icon image path

flutter:
  uses-material-design: true

  assets:
    - assets/
